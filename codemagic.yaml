workflows:
  ios-free-signing:
    name: iOS Free Development (7-day)
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: "com.example.potentialAidApp"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      cocoapods: default
      xcode: latest
      groups:
        - personal # Contains APPLE_ID and APPLE_ID_PASSWORD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          # This generates a free development certificate and profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --export-options-plist=/tmp/xcodebuild_config/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_config/export_options.plist
    publishing:
      email:
        recipients:
          - maciejll@wp.pl
        notify:
          success: true
          failure: true
