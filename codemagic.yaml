scripts:
  - name: Set up keychain
    script: |
      keychain initialize

  - name: Configure automatic signing
    script: |
      # Enable automatic signing in Xcode project
      cd ios
      sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Runner.xcodeproj/project.pbxproj
      sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj

  - name: Get Flutter packages
    script: |
      flutter packages pub get

  - name: Install CocoaPods dependencies
    script: |
      cd ios && pod install  # ✅ Fixed - navigates to ios directory first

  - name: Build IPA with automatic signing
    script: |
      flutter build ipa \
        --release \
        --build-name=1.0.0 \
        --build-number=1
