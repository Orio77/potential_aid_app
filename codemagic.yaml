workflows:
  ios-free-signing:
    name: iOS Free Development (7-day)
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: "com.example.potentialAidApp"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      cocoapods: default
      xcode: latest
      groups:
        - personal
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Configure automatic signing
        script: |
          # Enable automatic signing in Xcode project
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build IPA with automatic signing
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=1
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - maciejll@wp.pl
        notify:
          success: true
          failure: true
